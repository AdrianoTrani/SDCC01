services:
  clientproxyserv:
    container_name: clientProxyServ
    stdin_open: true
    tty: true
    hostname: proxy
    ports:
      - "8080:80"
      - "9001:9001"
    environment:
      NAME: "proxy"
      PORT: "50050"
      ALLCNODES: "cNode01:50051,cNode02:50052,cNode03:50053,cNode04:50054"
    build:
      context: .
    command: ["go", "run", "proxyCode.go", "utility.go","commonComm.go"]

  consensusnode01:
    container_name: consensusNode01
    hostname: cNode01
    volumes:
      - volCons01:/mem
    environment:
      NAME: "cNode01"
      PORT: "50051"
      ALLPEERS: "cNode02:50052,cNode03:50053,cNode04:50054"
    build:
      context: .
    command: ["go", "run", "conNodeCode.go", "utility.go","commonComm.go"]

  consensusnode02:
    container_name: consensusNode02
    hostname: cNode02
    volumes:
      - volCons02:/mem
    environment:
      NAME: "cNode02"
      PORT: "50052"
      ALLPEERS: "cNode01:50051,cNode03:50053,cNode04:50054"
    build:
      context: .
    command: ["go", "run", "conNodeCode.go", "utility.go","commonComm.go"]

  consensusnode03:
    container_name: consensusNode03
    hostname: cNode03
    volumes:
      - volCons03:/mem
    environment:
      NAME: "cNode03"
      PORT: "50053"
      ALLPEERS: "cNode01:50051,cNode02:50052,cNode04:50054"
    build:
      context: .
    command: ["go", "run", "conNodeCode.go", "utility.go","commonComm.go"]

  consensusnode04:
    container_name: consensusNode04
    hostname: cNode04
    volumes:
      - volCons04:/mem
    environment:
      NAME: "cNode04"
      PORT: "50054"
      ALLPEERS: "cNode01:50051,cNode02:50052,cNode03:50053"
    build:
      context: .
    command: ["go", "run", "conNodeCode.go", "utility.go","commonComm.go"]

  snapshotnode:
    container_name: snapshotNode
    hostname: snaps
    environment:
      NAME: "snaps"
      PORT: "50049"
      ALLCNODES: "cNode01:50051,cNode02:50052,cNode03:50053,cNode04:50054"
    build:
      context: .
    command: ["go", "run", "snapshotCode.go", "utility.go","commonComm.go"]

networks:
  default:
    name: sdcc_net


volumes:
  volCons01:
  volCons02:
  volCons03:
  volCons04: